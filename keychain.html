    <h1>Solar Cycle</h1>
    <p>A subtle period-tracking keychain designed for busy college students. Designed in Rhino 3D, and casted with plastic. Airbrushed acrylic and paint marker finish. Made as a part of a team of two in Winter 2025-early Spring 2026.</p>
</header>

<main>

    <figure>
    <img src="graphics/solar_cycle_incontext.png" alt="A UFO shaped keychain clipped onto a bag on the left, on the right, a hand holding a grey pouch with a comet on it." width="360" height="360" />
	<figcaption> What if busy college students could have a constant reminder to take care of their menstrual health? </figcaption>
    </figure>

    <figure>
    <img src="graphics/solar_cycle_final1.png" alt="A UFO shaped keychain with 4 magnet divets with different color, paired with a blue card with text on it, inside a blue-grey pouch with a black comet on it." width="360" height="360" />
	<figcaption> Solar Cycle comes in a kit. </figcaption>
    </figure>

    <figure>
    <img src="graphics/solarcycle+card3.png" alt="A UFO shaped keychain with 4 magnet divets with different color, paired with a blue card with text on it." width="360" height="360" />
	<figcaption> The card has a simple explanation of the menstrual cycle and its different phases, with each planet on the keychain representing a different phase. </figcaption>
    </figure>

    <figure>
    <img src="graphics/how_touse.png" alt="A graphic that shows a large hand holding a star over the UFO-shaped keychain." width="360" height="360" />
	<figcaption> The user represents the star, traveling around the center of the keychain to each planet with a magnet fit mechanism. </figcaption>
    </figure>

    <figure>
    <img src="graphics/packing_final1.png" alt="A blue pouch with feminine hygiene products inside." width="360" height="360" />
	<figcaption> The packaging can also be used to store feminine hygiene products. </figcaption>
    </figure>
